<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harper Checker</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#6b7280; --line:#e3e6eb; --accent:#2563eb; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --panel:#1f2229; --text:#e6e8ec; --muted:#9aa1ad; --line:#30343d; --accent:#60a5fa; --bad:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font:14px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:15px; margin:0; flex:1; }
  #status { color:var(--muted); }
  select, button { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  main { flex:1; display:flex; min-height:0; }
  textarea { flex:1; resize:none; border:0; outline:0; padding:16px; background:var(--panel); color:var(--text); font:15px/1.6 "Segoe UI", system-ui, sans-serif; }
  aside { width:340px; overflow:auto; border-left:1px solid var(--line); padding:8px; }
  .issue { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:8px; cursor:pointer; }
  .issue:hover { border-color:var(--accent); }
  .kind { font-size:12px; color:var(--muted); }
  .bad { color:var(--bad); text-decoration:line-through; }
  .fixes { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .fixes button { color:var(--accent); }
  .empty { color:var(--muted); text-align:center; margin-top:40px; }
</style>
</head>
<body>
<header>
  <h1>Harper Checker</h1>
  <span id="status">Loading…</span>
  <select id="dialect" title="English dialect">
    <option value="American">American</option>
    <option value="British">British</option>
    <option value="Australian">Australian</option>
    <option value="Canadian">Canadian</option>
    <option value="Indian">Indian</option>
  </select>
  <button id="paste">Paste</button>
  <button id="copy">Copy all</button>
</header>
<main>
  <textarea id="text" spellcheck="false" placeholder="Paste or type your text here…"></textarea>
  <aside id="issues"></aside>
</main>
<script src="harper.bundle.js"></script>
<script>
const { LocalLinter, Dialect, binaryInlined } = Harper;
const $ = id => document.getElementById(id);
const textEl = $('text'), issuesEl = $('issues'), statusEl = $('status');
let linter, run = 0, timer;

async function makeLinter() {
  statusEl.textContent = 'Loading…';
  linter = new LocalLinter({ binary: binaryInlined, dialect: Dialect[$('dialect').value] });
  await linter.setup();
  try { localStorage.setItem('dialect', $('dialect').value); } catch {}
  check();
}

async function check() {
  if (!linter) return;
  const id = ++run, text = textEl.value;
  const lints = await linter.lint(text);
  if (id !== run) return; // a newer check started while this one ran
  statusEl.textContent = lints.length ? `${lints.length} issue${lints.length > 1 ? 's' : ''}` : 'No issues';
  issuesEl.replaceChildren();
  if (!lints.length) issuesEl.innerHTML = `<p class="empty">${text.trim() ? 'Looks good ✓' : 'Nothing to check yet'}</p>`;
  for (const lint of lints) {
    const { start, end } = lint.span();
    const card = document.createElement('div');
    card.className = 'issue';
    card.innerHTML = `<div class="kind"></div><div class="bad"></div><div class="msg"></div><div class="fixes"></div>`;
    card.querySelector('.kind').textContent = lint.lint_kind_pretty();
    card.querySelector('.bad').textContent = text.slice(start, end);
    card.querySelector('.msg').textContent = lint.message();
    card.onclick = () => { textEl.focus(); textEl.setSelectionRange(start, end); };
    for (const s of lint.suggestions()) {
      const b = document.createElement('button');
      const rep = s.get_replacement_text();
      b.textContent = s.kind() === 1 ? 'Remove' : (s.kind() === 2 ? `Insert “${rep}”` : rep || '(empty)');
      b.onclick = async e => {
        e.stopPropagation();
        textEl.value = await linter.applySuggestion(textEl.value, lint, s);
        check();
      };
      card.querySelector('.fixes').append(b);
    }
    issuesEl.append(card);
  }
}

textEl.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(check, 300); });
$('dialect').addEventListener('change', makeLinter);
$('copy').onclick = async () => { await navigator.clipboard.writeText(textEl.value); statusEl.textContent = 'Copied ✓'; };
$('paste').onclick = async () => { textEl.value = await navigator.clipboard.readText(); check(); };
try { $('dialect').value = localStorage.getItem('dialect') || 'American'; } catch {}
makeLinter();
</script>
</body>
</html>
